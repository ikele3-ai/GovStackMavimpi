<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dossier Patient – GovStack Santé RDC</title>
  <meta name="description" content="Gestion des dossiers patients hospitaliers – solution GovStack pour la République Démocratique du Congo">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="brand">
      <img src="/favicon.svg" alt="" width="28" height="28">
      <div>
        <strong>Santé RDC</strong>
        <small>Dossier Patient · GovStack</small>
      </div>
    </div>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="userbox">
      <span id="whoami"></span>
      <button type="button" class="btn ghost small" data-action="logout">Déconnexion</button>
    </div>
  </header>
  <main id="app" tabindex="-1">
    <p class="loading">Chargement…</p>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog">
    <form method="dialog" id="dialog-form" novalidate>
      <header>
        <h2 id="dialog-title"></h2>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Fermer">×</button>
      </header>
      <div id="dialog-body"></div>
      <div class="form-errors" id="dialog-errors" role="alert"></div>
      <footer id="dialog-footer">
        <button type="button" class="btn ghost" data-action="close-dialog">Annuler</button>
        <button type="submit" class="btn primary" id="dialog-submit">Enregistrer</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
